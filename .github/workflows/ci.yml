name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so pip-audit and gitleaks run even when nothing gets pushed.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check src/ tests/ tools/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ tools/

      - name: mypy
        run: uv run mypy src/medtext_redact tools/gen_fixtures.py

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action posts a PR comment on findings
    steps:
      # v6, matching gitleaks-action v3's stated Node 24 compatibility guidance
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: this repo's history is original and preserved, not reinitialized

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: pip-audit (locked dependencies)
        run: uv export --no-dev --format requirements-txt | uvx pip-audit -r /dev/stdin

      # Pinned to the full commit SHA for the v3.0.0 tag, verified against
      # https://github.com/gitleaks/gitleaks-action/releases/tag/v3.0.0
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
