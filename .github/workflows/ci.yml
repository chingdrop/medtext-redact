name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so pip-audit and gitleaks run even when nothing gets pushed.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check src/ tests/ tools/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ tools/

      - name: mypy
        run: uv run mypy src/medtext_redact tools/

  # A single job on Python 3.12, the requires-python floor and the
  # .python-version pin.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # The coverage floor lives in pyproject.toml ([tool.coverage.report]
      # fail_under): the baseline measured 2026-10-03 was 98.21% branch
      # coverage, and the floor is that baseline minus 2.
      - name: Run tests
        run: uv run pytest -v --cov

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # pip-audit and gitleaks are separate jobs so that a failure in one never
  # skips the other. They used to be steps in one job, and the 2026-09-28
  # scheduled run's pip-audit failure meant gitleaks never ran at all.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      # No `uv sync` needed: `uv export` reads uv.lock directly, so this job
      # skips installing the project and its ~400 MB spaCy model.
      #
      # --no-emit-project: without it, uv export emits an "-e ." line for
      # this package itself, which pip-audit can't resolve. Third-party
      # dependencies are all pip-audit needs to check; the local package
      # isn't on PyPI.
      #
      # --no-deps --disable-pip: the export already pins every dependency,
      # so pip-audit checks the list as-is instead of building a venv to
      # resolve it. It skips the spaCy model, a URL requirement that isn't
      # on PyPI.
      - name: Export locked dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements-audit.txt"

      - name: pip-audit (locked dependencies)
        run: uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements-audit.txt" --no-deps --disable-pip

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action posts a PR comment on findings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: this repo's history is original and preserved, not reinitialized

      # gitleaks-action scans only the new commits on push and pull_request
      # events, and the full history on the weekly scheduled run.
      #
      # Pinned to the full commit SHA for the v3.0.0 tag, verified against
      # https://github.com/gitleaks/gitleaks-action/releases/tag/v3.0.0
      - name: gitleaks (new commits; full history weekly)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
