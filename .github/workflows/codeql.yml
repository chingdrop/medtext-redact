name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL results to code scanning
      actions: read # required by the analyze step to query workflow-run info
    steps:
      - uses: actions/checkout@v7

      # Pinned to the full commit SHA for each tag (originally v3.38.2, now
      # v4.38.1 via Dependabot) -- verify a new SHA the same way before
      # accepting it: resolve the tag on github.com/github/codeql-action/releases.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
