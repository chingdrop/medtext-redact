[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medtext-redact"
description = "A Command-Line Interface for HIPAA Redaction and Semantic Highlighting in Medical Text"
authors = [{ name = "Craig Hurley", email = "chingdorp@pm.me" }]
license = { file = "LICENSE" }
version = "2.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.0,<4.0.0",
    "numpy>=1.24.3,<3.0.0",
    "click>=7.1.2",
    "requests>=2.32",
    "certifi>=2024.7.4",
    "urllib3>=2.0",
    "charset-normalizer>=3.0.1",
    "rich>=14.0.0",
    "pyahocorasick>=2.1.0",
    "openpyxl>=3.1.5",
]

[project.urls]
Repository = "https://github.com/chingdrop/medtext-redact"

[project.scripts]
medtext-redact = "medtext_redact.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=3.0.0,<4.0.0",
    "types-pyyaml>=6.0.12.20260518",
    "faker>=30.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medtext_redact"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ahocorasick"]
ignore_missing_imports = true
