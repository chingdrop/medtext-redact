[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-console"
description = "Python-based solution designed to provide tools for extracting, transforming, and loading data."
authors = [{ name = "Craig Hurley", email = "chingdorp@pm.me" }]
version = "2.1.0"
readme = "README.md"
dependencies = [
    "Pandas >=2.0.3, <3.0.0",
    "NumPy >=1.24.3, <2.0.0",
    "click >=7.1.2",
    "requests >=2.23.3",
    "charset-normalizer >=3.0.1"
]

[project.urls]
Repository = "https://github.com/churley-vega/vt-console"

[project.scripts]
vt-console = "vt_console.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]