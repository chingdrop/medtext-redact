[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vega-tools"
description = "Python-based solution designed to provide tools for extracting, transforming, and loading data."
authors = [{ name = "Craig Hurley", email = "chingdorp@pm.me" }]
version = "2.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.3,<3.0.0",
    "numpy>=1.24.3,<2.0.0",
    "click>=7.1.2",
    "requests>=2.23.3",
    "charset-normalizer>=3.0.1",
    "rich>=14.0.0",
    "pyahocorasick>=2.1.0",
    "openpyxl>=3.1.5",
    "nltk>=3.9.1",
]

[project.urls]
Repository = "https://github.com/churley-vega/vega-tools"

[project.scripts]
vega-tools = "vega_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vega_tools"]
